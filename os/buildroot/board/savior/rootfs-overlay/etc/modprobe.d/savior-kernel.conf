# SaviorOS module settings for the Buildroot kernel only (this is
# os/buildroot/board/savior/rootfs-overlay; the settings shared with the dev
# image are in os/rootfs-overlay/etc/modprobe.d/savior.conf).

# GCN 1.1 ("Sea Islands", CIK) GPUs are amdgpu territory: Kabini, Beema and
# Mullins APUs, Kaveri, Radeon HD 7790 / R7 260 (Bonaire), R9 290 (Hawaii).
# This kernel has no amdgpu (linux/display.config), so radeon would claim
# them, remove the firmware framebuffer and then fail for lack of the CIK
# firmware that firmware.list leaves out: /dev/fb0 and the screen go dark.
# With cik_support=0 radeon refuses them before touching the framebuffer,
# and simpledrm/efifb/vesafb keep the display. post-build.sh checks that
# this line is present while the kernel builds radeon without amdgpu's CIK
# support.
options radeon cik_support=0
