# /etc/savior/savior.conf - SaviorOS image defaults.
#
# This is the lowest-priority config file. /etc/savior/baked.conf (built
# into the boot image), savior.conf on the SaviorOS stick and savior.<key>=
# on the kernel command line override it (DESIGN 5.1). Edit savior.conf on
# the stick, not this file.

# Refuse tasks that cannot get full isolation (namespaces, cgroups, seccomp,
# dropped privileges). Jobs that say isolation = any may still run.
sandbox = strict
