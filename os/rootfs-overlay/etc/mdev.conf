# /etc/mdev.conf - SaviorOS device nodes (BusyBox mdev, hotplug + mdev -s).
#
# <regex> <uid>:<gid> <mode> [@command]
# The regex must match the whole device name as the kernel names it,
# including subdirectories (dri/card0, input/event3, net/tun). The first
# matching rule wins; a leading "-" applies the rule and keeps matching.
# Unmatched devices get root:root 0660. Groups (numeric, see /etc/group):
# 5 tty, 6 disk, 44 video, 97 input. There are no users besides root, so
# 0660 root:<group> is root-only. Firmware is loaded by the kernel itself.

# Load the driver for every device that shows up after boot (coldplug is
# done by /etc/init.d/S05mdev).
-$MODALIAS=.*		0:0	660	@modprobe -q "$MODALIAS"

null			0:0	666
zero			0:0	666
full			0:0	666
random			0:0	666
urandom			0:0	666
tty			0:5	666
ptmx			0:5	666
console			0:5	600
tty[0-9]+		0:5	620
ttyS[0-9]+		0:5	660
vcsa?[0-9]*		0:5	600
vcsu?[0-9]*		0:5	600
kmsg			0:0	600
mem			0:0	600
port			0:0	600
rtc[0-9]*		0:0	600
watchdog[0-9]*		0:0	600
cpu/[0-9]+/(msr|cpuid)	0:0	600
net/tun			0:0	600
fuse			0:0	600

# Display and input: only the node agent (root) uses them.
fb[0-9]+		0:44	660
dri/.*			0:44	660
input/.*		0:97	660

# Disks.
sd[a-z]+[0-9]*		0:6	660
sr[0-9]+		0:6	660
mmcblk[0-9]+.*		0:6	660
nvme[0-9]+.*		0:6	660
vd[a-z]+[0-9]*		0:6	660
loop[0-9]+		0:6	660
zram[0-9]+		0:6	660
